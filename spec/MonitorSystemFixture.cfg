\* TLC configuration: one monitor, one line per window, a queue cap of two, a
\* total budget of three emitted lines, and two generations. Large enough for
\* arm/admit/emit, exceeding the rate into a digest, cancelling into a stale
\* effect, re-arming, crashing, timing out, reconciling after pi death, and
\* clearing a finished monitor.
CONSTANTS
    Monitors = {"m1"}
    Rate = 1
    Cap = 2
    MaxGen = 3
    MaxEmitted = 4

SPECIFICATION Spec

INVARIANT ViewInv
PROPERTY Liveness

\* Emit is gated by the total budget, so some reachable states have no enabled
\* action; the spec permits stuttering there.
CHECK_DEADLOCK FALSE
